<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CodeSync — Sign in</title>
<style>
  body{background:#1e1e2e;color:#e4e4ef;font-family:-apple-system,system-ui,sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;}
  form{background:#262637;padding:24px;border-radius:12px;width:280px;max-width:90vw;}
  h1{font-size:18px;margin:0 0 16px;}
  input{width:100%;box-sizing:border-box;padding:10px;margin-bottom:10px;border-radius:8px;border:1px solid #38384f;background:#1e1e2e;color:#e4e4ef;font-size:14px;}
  button{width:100%;padding:10px;border-radius:8px;border:none;background:#6ea8fe;color:#111;font-weight:600;font-size:14px;}
  #toggle{margin-top:12px;text-align:center;font-size:13px;color:#9797ac;}
  #toggle a{color:#6ea8fe;cursor:pointer;}
  #err{color:#f28b82;font-size:13px;min-height:16px;margin-bottom:4px;}
</style>
</head>
<body>
<form id="form">
  <h1 id="title">Sign in to CodeSync</h1>
  <div id="err"></div>
  <input id="username" placeholder="Username" autocomplete="username" required>
  <input id="password" type="password" placeholder="Password" autocomplete="current-password" required>
  <button type="submit" id="submitBtn">Sign in</button>
  <div id="toggle"><span id="toggleText">New here? </span><a id="toggleLink">Create an account</a></div>
</form>
<script>
  let mode = 'login';
  const form = document.getElementById('form');
  const title = document.getElementById('title');
  const submitBtn = document.getElementById('submitBtn');
  const toggleLink = document.getElementById('toggleLink');
  const toggleText = document.getElementById('toggleText');
  const errEl = document.getElementById('err');

  toggleLink.addEventListener('click', () => {
    mode = mode === 'login' ? 'register' : 'login';
    title.textContent = mode === 'login' ? 'Sign in to CodeSync' : 'Create your CodeSync account';
    submitBtn.textContent = mode === 'login' ? 'Sign in' : 'Create account';
    toggleText.textContent = mode === 'login' ? 'New here? ' : 'Already have an account? ';
    toggleLink.textContent = mode === 'login' ? 'Create an account' : 'Sign in';
    errEl.textContent = '';
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errEl.textContent = '';
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    try {
      const res = await fetch('/api/' + mode, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      const data = await res.json();
      if (!res.ok) { errEl.textContent = data.error || 'Something went wrong.'; return; }
      const params = new URLSearchParams(location.search);
      location.href = params.get('next') || '/';
    } catch (err) {
      errEl.textContent = 'Network error — try again.';
    }
  });
</script>
</body>
</html>
