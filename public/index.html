<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CodeSync</title>
<style>
:root{--bg:#14111f;--panel:#1c1830;--line:#2e2750;--fg:#e9e4f5;--mute:#8f86ad;--acc:#b48cff;--ok:#7fe0b0;--bad:#ff8fa3;
--mono:ui-monospace,"Cascadia Code",Consolas,Menlo,monospace}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
h1{font-size:17px;margin:0 auto 0 0;font-weight:650;letter-spacing:.2px}
.pill{font-size:13px;color:var(--mute)}
.pill b{color:var(--fg);font-weight:600}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--bad);margin-right:6px}
.on .dot{background:var(--ok)}
button{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--panel);color:var(--fg);padding:6px 14px;border-radius:6px;cursor:pointer}
button:hover{border-color:var(--acc)}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
button.run{background:var(--acc);color:#1a1030;border-color:var(--acc);font-weight:650}
button:disabled{opacity:.5;cursor:wait}
main{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr}
@media(max-width:800px){main{grid-template-columns:1fr;grid-template-rows:1fr 1fr}}
section{min-height:0;display:flex;flex-direction:column}
section+section{border-left:1px solid var(--line)}
@media(max-width:800px){section+section{border-left:0;border-top:1px solid var(--line)}}
.label{padding:6px 16px;font-size:13px;color:var(--mute);border-bottom:1px solid var(--line)}
.label.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:4px 16px}
.label.row button{padding:3px 10px;font-size:13px;flex:none}
.tabs{display:flex;border-bottom:1px solid var(--line);overflow-x:auto;flex:none}
.tab{border:0;border-bottom:2px solid transparent;border-radius:0;background:none;color:var(--mute);padding:8px 14px;white-space:nowrap}
.tab:hover{color:var(--fg)}
.tab[aria-selected=true]{color:var(--fg);border-bottom-color:var(--acc)}
textarea,pre{flex:1;margin:0;padding:14px 16px;border:0;resize:none;background:transparent;color:var(--fg);font:14px/1.6 var(--mono);tab-size:2;white-space:pre;overflow:auto}
textarea{caret-color:var(--acc)}
pre{white-space:pre-wrap;background:var(--panel)}
.label.row .btns{display:flex;gap:6px;flex:none}
#gList{flex:1;min-height:0;overflow:auto;padding:10px 12px;display:flex;flex-direction:column;gap:10px;background:var(--panel)}
#gList.stale{opacity:.4;pointer-events:none}
#gErr{padding:8px 14px;font-size:13px;color:var(--bad);border-bottom:1px solid var(--line);background:#2a1a28}
.card{display:flex;gap:12px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px}
.thumb{flex:none;width:76px;height:76px;border-radius:8px;background:repeating-conic-gradient(#2a2445 0% 25%,#221d38 0% 50%) 50%/16px 16px}
.cinfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px}
.ctop{display:flex;align-items:center;justify-content:space-between;gap:8px}
.cname{font-weight:650}
.csnip{font:12px var(--mono);color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crow{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;font-size:13px;color:var(--mute)}
.fld{display:inline-flex;align-items:center;gap:5px;font-size:13px;color:var(--mute)}
.fld input[type=number]{width:66px;padding:4px 6px;font-size:13px}
.fld input[type=color]{width:34px;height:26px;padding:1px}
.fld input[type=checkbox]{width:auto}
.fld input:not([type=number]):not([type=color]):not([type=checkbox]){width:110px;padding:4px 6px;font-size:13px}
.sel{font:inherit;font-size:13px;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 6px}
.ptag{font:600 12px var(--mono);color:var(--acc)}
.cwarn{font-size:12px;color:#ffb454}
button.mini{padding:3px 10px;font-size:12px;flex:none}
.empty{color:var(--mute);font-size:14px;padding:6px 2px}
#preview{flex:1;min-height:0;width:100%;border:0;background:#fff}
#console{flex:none;height:96px;padding:8px 12px;font-size:12px;line-height:1.4;border-top:1px solid var(--line)}
#outWeb.full{position:fixed;inset:0;z-index:30;background:var(--bg);padding-top:env(safe-area-inset-top,0px)}
.wrap{position:relative;flex:1;min-height:0;display:flex}
textarea{padding:22px 16px 14px}
#cur{position:absolute;inset:0;overflow:hidden;pointer-events:none}
#mir{position:absolute;left:0;top:0;visibility:hidden;padding:22px 16px 14px;font:14px/1.6 var(--mono);white-space:pre;tab-size:2}
.caret{position:absolute;width:2px;height:22.4px}
.caret i{position:absolute;bottom:100%;left:0;font:600 11px/16px system-ui,sans-serif;padding:0 5px;border-radius:3px 3px 3px 0;white-space:nowrap}
.hide{display:none!important}
#auth{flex:1;display:grid;place-items:center;padding:20px}
#auth form{width:min(340px,100%);display:flex;flex-direction:column;gap:10px}
#auth h2{margin:0 0 4px;font-size:22px}
input{font:inherit;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%}
input[type=color]{padding:2px;height:34px;width:56px}
.err{color:var(--bad);font-size:13px;min-height:18px}
.link{background:none;border:0;color:var(--acc);padding:0;text-align:left}
#me{display:flex;align-items:center;gap:8px}
.sw{width:12px;height:12px;border-radius:50%;display:inline-block;flex:none}
#prof{position:absolute;right:16px;top:52px;z-index:5;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;width:min(280px,calc(100% - 32px));display:flex;flex-direction:column;gap:10px}
#prof label{font-size:13px;color:var(--mute);display:flex;flex-direction:column;gap:4px}
#people{display:flex;gap:10px;flex-wrap:wrap}
</style>
</head>
<body>
<div id="auth" class="hide">
  <form id="af">
    <h2 id="at">Sign in to CodeSync</h2>
    <input id="an" placeholder="Account name" autocomplete="username" maxlength="20" required aria-label="Account name">
    <input id="ap" type="password" placeholder="Password" autocomplete="current-password" required aria-label="Password">
    <input id="ai" placeholder="Invite code (if you were given one)" class="hide" aria-label="Invite code">
    <div class="err" id="ae" role="alert"></div>
    <button class="run" id="ab">Sign in</button>
    <button type="button" class="link" id="as">New here? Create an account</button>
  </form>
</div>
<header id="top" class="hide">
  <h1>CodeSync</h1>
  <span class="pill"><span class="dot"></span><span id="st">connecting</span></span>
  <span class="pill">Round trip <b id="rtt">–</b></span>
  <span id="people" class="pill"></span>
  <button id="copy">Copy room link</button>
  <button id="me" aria-haspopup="true"><span class="sw" id="msw"></span><span id="mn"></span></button>
  <button id="run" class="run" disabled>Run</button>
</header>
<div id="prof" class="hide">
  <label>Name shown on your cursor<input id="pn" maxlength="20"></label>
  <label>Cursor color<input id="pc" type="color"></label>
  <div class="err" id="pe" role="alert"></div>
  <button id="ps" class="run">Save</button>
  <button id="lo" class="link">Sign out</button>
</div>
<main id="app" class="hide">
  <section>
    <div class="tabs" id="tabs" role="tablist" aria-label="Files"></div>
    <div class="wrap">
      <textarea id="ed" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="Code editor" readonly></textarea>
      <div id="cur"></div><div id="mir"></div>
    </div>
  </section>
  <section id="outWeb">
    <div class="label row"><span>Preview: Run builds everything and starts it</span><span class="btns"><button id="toAssets" class="hide">Assets</button><button id="fs">Fullscreen</button></span></div>
    <iframe id="preview" title="Preview" sandbox="allow-scripts"></iframe>
    <pre id="console" aria-label="Console">Press Run to start your project.</pre>
  </section>
  <section id="outAssets" class="hide">
    <div class="label row"><span id="gSummary">Assets</span><span class="btns"><button id="gNew">+ New asset</button><button id="gPreview">Preview</button></span></div>
    <div id="gErr" class="hide" role="alert"></div>
    <div id="gList" aria-label="Asset gallery"></div>
  </section>
</main>
<script>
const $ = q => document.querySelector(q);
const ed = $('#ed'), runBtn = $('#run');
const room = location.hash.slice(1) || Math.random().toString(36).slice(2, 7);
location.hash = room;
const api = async (path, body) => {
  const r = await fetch(path, { method: body === undefined ? 'GET' : 'POST', headers: { 'Content-Type': 'application/json' }, body: body === undefined ? undefined : JSON.stringify(body) });
  return { ok: r.ok, data: await r.json().catch(() => ({})) };
};
const ink = hex => (parseInt(hex.slice(1, 3), 16) * 299 + parseInt(hex.slice(3, 5), 16) * 587 + parseInt(hex.slice(5, 7), 16) * 114) / 1000 > 140 ? '#14111f' : '#fff';

// ---- the four files in every room ----
const TABS = [
  { k: 'html', label: 'HTML', file: 'index.html' },
  { k: 'css', label: 'CSS', file: 'style.css' },
  { k: 'js', label: 'JavaScript', file: 'script.js' },
  { k: 'assets', label: 'Assets', file: 'assets.json' },
];
const langLabel = k => (TABS.find(t => t.k === k) || {}).label || k;
const SHAPE_LIST = ['rect', 'circle', 'ellipse', 'triangle', 'diamond', 'polygon', 'star', 'heart', 'line', 'text'];
// names an object already uses itself, so they can't be used for your own properties
const RESERVED = ['x', 'y', 'w', 'h', 'scale', 'angle', 'opacity', 'visible', 'z', 'vx', 'vy', 'gravity', 'control', 'edges', 'alive', 'parts', 'id', 'name', 'tags', 'r', 'color', 'text', 'baseW', 'baseH', 'destroy', 'setSize', 'grow', 'moveTo', 'distanceTo', 'touching', 'stayInWorld'];

// ---- sign in / sign up ----
let signup = false, me = null;
function authMode(on) {
  signup = on;
  $('#at').textContent = on ? 'Create your account' : 'Sign in to CodeSync';
  $('#ab').textContent = on ? 'Create account' : 'Sign in';
  $('#as').textContent = on ? 'Already have an account? Sign in' : 'New here? Create an account';
  $('#ai').classList.toggle('hide', !on);
  $('#ap').autocomplete = on ? 'new-password' : 'current-password';
  $('#ae').textContent = '';
}
$('#as').onclick = () => authMode(!signup);
$('#af').onsubmit = async e => {
  e.preventDefault();
  const r = await api(signup ? '/api/signup' : '/api/login', { name: $('#an').value, password: $('#ap').value, invite: $('#ai').value });
  if (r.ok) start(r.data); else $('#ae').textContent = r.data.error || 'Something went wrong';
};
function showMe() { $('#mn').textContent = me.name; $('#msw').style.background = me.color; }
function start(u) {
  me = u; showMe();
  $('#auth').classList.add('hide');
  for (const q of ['#top', '#app']) $(q).classList.remove('hide');
  connect();
}
(async () => { const r = await api('/api/me'); if (r.ok) start(r.data); else $('#auth').classList.remove('hide'); })();

// ---- profile ----
$('#me').onclick = () => { $('#pn').value = me.name; $('#pc').value = me.color; $('#pe').textContent = ''; $('#prof').classList.toggle('hide'); };
$('#ps').onclick = async () => {
  const r = await api('/api/profile', { name: $('#pn').value, color: $('#pc').value });
  if (!r.ok) return $('#pe').textContent = r.data.error || 'Could not save';
  me = r.data; showMe(); $('#prof').classList.add('hide');
  wsSend('{"type":"profile"}');
};
$('#lo').onclick = async () => { await api('/api/logout', {}); location.reload(); };

// ---- operational transform: ops are {t:'i',p,s} or {t:'d',p,n} ----
function xf(a, b, after) {
  if (b.t === 'i') {
    if (a.t === 'i') return [b.p < a.p || (b.p === a.p && after) ? { ...a, p: a.p + b.s.length } : a];
    if (b.p <= a.p) return [{ ...a, p: a.p + b.s.length }];
    if (b.p < a.p + a.n) { const k = b.p - a.p; return [{ t: 'd', p: a.p, n: k }, { t: 'd', p: a.p + b.s.length, n: a.n - k }]; }
    return [a];
  }
  if (a.t === 'i') return [b.p + b.n <= a.p ? { ...a, p: a.p - b.n } : b.p < a.p ? { ...a, p: b.p } : a];
  const ov = Math.max(0, Math.min(a.p + a.n, b.p + b.n) - Math.max(a.p, b.p)), n = a.n - ov;
  return n ? [{ t: 'd', p: b.p < a.p ? a.p - Math.min(b.n, a.p - b.p) : a.p, n }] : [];
}
function xfLists(A, B, after) {
  if (!A.length || !B.length) return [A, B];
  if (A.length === 1 && B.length === 1) return [xf(A[0], B[0], after), xf(B[0], A[0], !after)];
  if (A.length > 1) {
    const [a1, B1] = xfLists([A[0]], B, after), [a2, B2] = xfLists(A.slice(1), B1, after);
    return [a1.concat(a2), B2];
  }
  const [A1, b1] = xfLists(A, [B[0]], after), [A2, b2] = xfLists(A1, B.slice(1), after);
  return [A2, b1.concat(b2)];
}
const apply = (s, o) => o.t === 'i' ? s.slice(0, o.p) + o.s + s.slice(o.p) : s.slice(0, o.p) + s.slice(o.p + o.n);
const moveCursor = (x, o) => o.t === 'i' ? (o.p <= x ? x + o.s.length : x) : (x >= o.p + o.n ? x - o.n : Math.min(x, o.p));

// =====================================================================
// THE ENGINE. These three functions are pasted into the preview page
// (so they must not use anything from outside themselves). normalizeAsset
// and drawParts are also used by the Assets gallery on this page.
// =====================================================================

// Turns one asset written in the Assets tab into a complete, checked asset.
function normalizeAsset(name, def) {
  var warnings = [];
  var SH = ['rect', 'circle', 'ellipse', 'triangle', 'diamond', 'polygon', 'star', 'heart', 'line', 'text'];
  var KNOWN = { shape: 1, w: 1, h: 1, color: 1, stroke: 1, lineWidth: 1, parts: 1, props: 1, tags: 1, control: 1, edges: 1, rotation: 1, opacity: 1, z: 1, text: 1, font: 1, sides: 1, points: 1, radius: 1, vx: 1, vy: 1, gravity: 1, scale: 1 };
  function warn(m) { warnings.push('Asset "' + name + '": ' + m); }
  if (!def || typeof def !== 'object' || Array.isArray(def)) { warn('write it like { "shape": "circle", "w": 20, "h": 20, "color": "gold" }'); def = {}; }
  for (var k in def) if (!KNOWN[k]) warn('unknown setting "' + k + '" (put your own values inside "props")');
  function num(v, d, label) {
    if (v === undefined || v === null) return d;
    if (typeof v !== 'number' || !isFinite(v)) { warn(label + ' should be a number'); return d; }
    return v;
  }
  function str(v, d, label) {
    if (v === undefined || v === null) return d;
    if (typeof v !== 'string') { warn(label + ' should be text in quotes'); return d; }
    return v;
  }
  function part(p, pre, dw, dh) {
    if (!p || typeof p !== 'object' || Array.isArray(p)) { warn(pre + ' should look like { "shape": "circle", "w": 10, "h": 10 }'); p = {}; }
    var shape = str(p.shape, 'rect', pre + 'shape');
    if (SH.indexOf(shape) < 0) { warn('unknown shape "' + shape + '" (try: ' + SH.join(', ') + ')'); shape = 'rect'; }
    return {
      shape: shape,
      x: num(p.x, 0, pre + 'x'), y: num(p.y, 0, pre + 'y'),
      w: num(p.w, dw, pre + 'w'), h: num(p.h, dh, pre + 'h'),
      color: str(p.color, '#cccccc', pre + 'color'), stroke: str(p.stroke, null, pre + 'stroke'),
      lineWidth: num(p.lineWidth, 2, pre + 'lineWidth'), rotation: num(p.rotation, 0, pre + 'rotation'),
      opacity: num(p.opacity, 1, pre + 'opacity'),
      sides: Math.max(3, Math.round(num(p.sides, 6, pre + 'sides'))), points: Math.max(3, Math.round(num(p.points, 5, pre + 'points'))),
      radius: Math.max(0, num(p.radius, 0, pre + 'radius')),
      text: p.text === undefined || p.text === null ? '' : String(p.text), font: str(p.font, 'sans-serif', pre + 'font')
    };
  }
  var single = !Array.isArray(def.parts);
  var isText = single && def.shape === 'text';
  var txtLen = def.text === undefined || def.text === null ? 0 : String(def.text).length;
  var w = num(def.w, undefined, 'w'), h = num(def.h, undefined, 'h');
  if (w === undefined && h === undefined) { h = isText ? 24 : 40; w = isText ? Math.max(h, h * 0.6 * txtLen) : 40; }
  else if (h === undefined) { h = isText ? 24 : w; }
  else if (w === undefined) { w = isText ? Math.max(h, h * 0.6 * txtLen) : h; }
  var parts = [];
  if (single) {
    parts.push(part({ shape: def.shape, x: 0, y: 0, w: w, h: h, color: def.color, stroke: def.stroke, lineWidth: def.lineWidth, radius: def.radius, sides: def.sides, points: def.points, text: def.text, font: def.font }, '', w, h));
  } else {
    def.parts.forEach(function (p, i) { parts.push(part(p, 'parts[' + i + '] ', w, h)); });
  }
  var control = def.control === undefined || def.control === null ? null : def.control;
  if (control !== null && ['move', 'pointer', 'both'].indexOf(control) < 0) { warn('control should be "move", "pointer" or "both"'); control = null; }
  var edges = def.edges === undefined || def.edges === null ? null : def.edges;
  if (edges !== null && ['stop', 'bounce', 'wrap', 'none'].indexOf(edges) < 0) { warn('edges should be "stop", "bounce", "wrap" or "none"'); edges = null; }
  if (control && !edges) edges = 'stop';
  var tags = def.tags === undefined || def.tags === null ? [] : (typeof def.tags === 'string' ? [def.tags] : def.tags);
  if (!Array.isArray(tags)) { warn('tags should be a list like ["enemy", "red"]'); tags = []; }
  tags = tags.filter(function (t) { return typeof t === 'string'; });
  var props = def.props === undefined || def.props === null ? {} : def.props;
  if (typeof props !== 'object' || Array.isArray(props)) { warn('props should look like { "speed": 100 }'); props = {}; }
  return {
    asset: {
      name: name, w: w, h: h, parts: parts, props: props, tags: tags, control: control, edges: edges || 'none',
      angle: num(def.rotation, 0, 'rotation'), opacity: num(def.opacity, 1, 'opacity'), z: num(def.z, 0, 'z'),
      vx: num(def.vx, 0, 'vx'), vy: num(def.vy, 0, 'vy'), gravity: num(def.gravity, 0, 'gravity'), scale: num(def.scale, 1, 'scale')
    },
    warnings: warnings
  };
}

// Draws an asset's shapes. The caller has already moved/rotated/scaled the canvas to the object.
function drawParts(ctx, parts) {
  function outline(p) {
    var w = p.w, h = p.h, s = p.shape, i, n, a, r;
    if (s === 'rect') {
      r = Math.min(p.radius, Math.abs(w) / 2, Math.abs(h) / 2);
      if (r > 0) {
        ctx.moveTo(-w / 2 + r, -h / 2);
        ctx.arcTo(w / 2, -h / 2, w / 2, h / 2, r); ctx.arcTo(w / 2, h / 2, -w / 2, h / 2, r);
        ctx.arcTo(-w / 2, h / 2, -w / 2, -h / 2, r); ctx.arcTo(-w / 2, -h / 2, w / 2, -h / 2, r);
        ctx.closePath();
      } else ctx.rect(-w / 2, -h / 2, w, h);
    } else if (s === 'circle' || s === 'ellipse') {
      ctx.ellipse(0, 0, Math.abs(w) / 2, Math.abs(h) / 2, 0, 0, Math.PI * 2);
    } else if (s === 'triangle') {
      ctx.moveTo(0, -h / 2); ctx.lineTo(w / 2, h / 2); ctx.lineTo(-w / 2, h / 2); ctx.closePath();
    } else if (s === 'diamond') {
      ctx.moveTo(0, -h / 2); ctx.lineTo(w / 2, 0); ctx.lineTo(0, h / 2); ctx.lineTo(-w / 2, 0); ctx.closePath();
    } else if (s === 'polygon') {
      n = p.sides;
      for (i = 0; i < n; i++) { a = -Math.PI / 2 + i * 2 * Math.PI / n; if (i) ctx.lineTo(Math.cos(a) * w / 2, Math.sin(a) * h / 2); else ctx.moveTo(Math.cos(a) * w / 2, Math.sin(a) * h / 2); }
      ctx.closePath();
    } else if (s === 'star') {
      n = p.points;
      for (i = 0; i < n * 2; i++) { a = -Math.PI / 2 + i * Math.PI / n; r = i % 2 ? 0.45 : 1; if (i) ctx.lineTo(Math.cos(a) * r * w / 2, Math.sin(a) * r * h / 2); else ctx.moveTo(Math.cos(a) * r * w / 2, Math.sin(a) * r * h / 2); }
      ctx.closePath();
    } else if (s === 'heart') {
      ctx.moveTo(0, h * 0.4);
      ctx.bezierCurveTo(-w * 0.6, -h * 0.05, -w * 0.3, -h * 0.5, 0, -h * 0.2);
      ctx.bezierCurveTo(w * 0.3, -h * 0.5, w * 0.6, -h * 0.05, 0, h * 0.4);
      ctx.closePath();
    }
  }
  for (var i = 0; i < parts.length; i++) {
    var p = parts[i];
    ctx.save();
    ctx.translate(p.x, p.y);
    if (p.rotation) ctx.rotate(p.rotation * Math.PI / 180);
    ctx.globalAlpha = ctx.globalAlpha * p.opacity;
    if (p.shape === 'text') {
      ctx.font = Math.max(1, p.h) + 'px ' + p.font; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillStyle = '#ff00ff'; ctx.fillStyle = p.color;   // a bad color shows up magenta instead of silently reusing the last one
      ctx.fillText(p.text, 0, 0);

// It also remembers where each value sits in the text, so the gallery can
// change one color or number without touching anything else.

  const info = h('div', 'cinfo');

  const top = h('div', 'ctop');
  top.append(h('span', 'cname', name));
  const copy = h('button', 'mini', 'Copy spawn'); copy.type = 'button';
  copy.onclick = async () => {
    try { await navigator.clipboard.writeText('spawn("' + name + '", 100, 100)'); copy.textContent = 'Copied'; setTimeout(() => { copy.textContent = 'Copy spawn'; }, 1200); } catch (e) {}
  };
  top.append(copy);
  info.append(top, h('div', 'csnip', 'spawn("' + name + '", x, y)'));

  if (isObj) {
    const sizes = h('div', 'crow');
    for (const dim of ['w', 'h']) if (has([name, dim]) && typeof def[dim] === 'number') sizes.append(numField(dim === 'w' ? 'Width' : 'Height', [name, dim], def[dim], 1));
    if (sizes.children.length) info.append(sizes);

    const multi = Array.isArray(def.parts);
    (multi ? def.parts : [def]).forEach((rp, i) => {
      if (!rp || typeof rp !== 'object' || Array.isArray(rp)) return;
      const path = multi ? [name, 'parts', String(i)] : [name];
      const row = h('div', 'crow');
      if (multi) row.append(h('span', 'ptag', '#' + (i + 1)));
      if (has(path.concat('shape')) && typeof rp.shape === 'string') row.append(shapeSelect(path.concat('shape'), rp.shape));
      for (const [prop, lab] of [['color', 'color'], ['stroke', 'outline']]) {
        if (has(path.concat(prop)) && typeof rp[prop] === 'string') row.append(colorField(lab, path.concat(prop), rp[prop]));
      }
      if (row.children.length) info.append(row);
    });

    const props = def.props && typeof def.props === 'object' && !Array.isArray(def.props) ? def.props : null;
    const prow = h('div', 'crow');
    if (props) for (const k of Object.keys(props)) {
      const v = props[k], path = [name, 'props', k], f = h('label', 'fld');
      f.append(k + ' ');
      if (typeof v === 'number' && has(path)) {
        const inp = h('input'); inp.type = 'number'; inp.value = String(v); inp.step = 'any';
        inp.onchange = () => { const n = Number(inp.value); if (inp.value !== '' && isFinite(n)) editValue(path, String(n)); };
        f.append(inp);
      } else if (typeof v === 'boolean' && has(path)) {
        const inp = h('input'); inp.type = 'checkbox'; inp.checked = v;
        inp.onchange = () => editValue(path, inp.checked ? 'true' : 'false');
        f.append(inp);
      } else if (typeof v === 'string' && has(path)) {
        const inp = h('input'); inp.type = 'text'; inp.value = v;
        inp.onchange = () => editValue(path, JSON.stringify(inp.value));
        f.append(inp);
      } else f.append(JSON.stringify(v));
      prow.append(f);
    }
    const toggle = h('button', 'mini', '+ property'); toggle.type = 'button';
    prow.append(toggle);
    info.append(prow);

    const addRow = h('div', 'crow hide');
    const kin = h('input'); kin.placeholder = 'name, like health'; kin.setAttribute('aria-label', 'Property name');
    const vin = h('input'); vin.placeholder = 'value, like 3'; vin.setAttribute('aria-label', 'Property value');
    const go = h('button', 'mini', 'Add'); go.type = 'button';
    const msg = h('span', 'cwarn');
    go.onclick = () => {
      const k = kin.value.trim();
      if (!/^[A-Za-z_$][\w$]*$/.test(k)) { msg.textContent = 'Use letters, numbers and _ (not starting with a number).'; return; }
      if (RESERVED.includes(k)) { msg.textContent = '"' + k + '" is already used by the engine. Pick another name.'; return; }
      if (props && Object.prototype.hasOwnProperty.call(props, k)) { msg.textContent = 'It already has "' + k + '".'; return; }
      const raw = vin.value.trim();
      const val = raw === '' ? '0' : (raw === 'true' || raw === 'false') ? raw : isFinite(Number(raw)) ? String(Number(raw)) : JSON.stringify(raw);
      const ok = props ? addMember([name, 'props'], k, val) : addMember([name], 'props', '{ ' + JSON.stringify(k) + ': ' + val + ' }');
      msg.textContent = ok ? '' : 'Could not add it. Check the Assets text for a mistake.';
    };
    addRow.append(kin, vin, go, msg);
    toggle.onclick = () => addRow.classList.toggle('hide');
    info.append(addRow);
  }
  for (const w of warnings.slice(0, 3)) info.append(h('div', 'cwarn', '⚠ ' + w));
  card.append(thumb, info);
  return card;
}
function refreshGallery() {
  clearTimeout(galleryTimer);
  const err = $('#gErr'), list = $('#gList');
  let p;
  try { p = parseRelaxed(files.assets.doc); }
  catch (e) { err.textContent = 'Assets: ' + e.message; err.classList.remove('hide'); list.classList.add('stale'); return; }
  err.classList.add('hide'); list.classList.remove('stale');
  const names = Object.keys(p.value);
  $('#gSummary').textContent = 'Assets (' + names.length + ')';
  list.textContent = '';
  if (!names.length) list.append(h('div', 'empty', 'No assets yet. Tap "+ New asset" to make one.'));
  for (const name of names) list.append(buildCard(name, p));
}
$('#gNew').onclick = () => {
  let p;
  try { p = parseRelaxed(files.assets.doc); }
  catch (e) { refreshGallery(); return; }
  let n = 1; while (Object.prototype.hasOwnProperty.call(p.value, 'asset' + n)) n++;
  const block = '  "asset' + n + '": {\n    "shape": "star",\n    "w": 40,\n    "h": 40,\n    "color": "#ff9de2",\n    "props": { }\n  }';
  const t = files.assets.doc;
  if (p.rootEmpty) commitLocal('assets', t.trimEnd() + '\n{\n' + block + '\n}\n');
  else commitLocal('assets', t.slice(0, p.insertAt) + (p.hasMembers ? ',\n' : '\n') + block + (p.hasMembers ? '' : '\n') + t.slice(p.insertAt));
  setTimeout(() => { const l = $('#gList'); l.scrollTop = l.scrollHeight; }, 200);
};

// ---- controls ----
runBtn.onclick = () => { rightView = 'preview'; updateRightPanel(); runProject(null); wsSend({ type: 'run' }); };   // run here now, and tell everyone else to rerun
$('#copy').onclick = async () => { try { await navigator.clipboard.writeText(location.href); $('#copy').textContent = 'Copied'; setTimeout(() => $('#copy').textContent = 'Copy room link', 1500); } catch {} };
const OPEN = { '(': ')', '{': '}', '[': ']' };
const CLOSERS = new Set([')', '}', ']']);
ed.addEventListener('keydown', e => {
  if (e.key === 'Tab') { e.preventDefault(); document.execCommand('insertText', false, '  '); return; }
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); runBtn.click(); return; }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const doc = files[active].doc;
  const s = ed.selectionStart, eIdx = ed.selectionEnd;
  if (s !== eIdx) return;   // leave an active selection alone
  if (e.key === '"') {
    e.preventDefault();
    if (doc[s] === '"') ed.setSelectionRange(s + 1, s + 1);          // skip over an existing closing quote
    else { document.execCommand('insertText', false, '""'); ed.setSelectionRange(s + 1, s + 1); }
    sendCursor();
  } else if (OPEN[e.key]) {
    e.preventDefault();
    document.execCommand('insertText', false, e.key + OPEN[e.key]);
    ed.setSelectionRange(s + 1, s + 1);
    sendCursor();
  } else if (CLOSERS.has(e.key) && doc[s] === e.key) {
    e.preventDefault();
    ed.setSelectionRange(s + 1, s + 1);                               // skip over an existing closing bracket
    sendCursor();
  }
});
</script>
