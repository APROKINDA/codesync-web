<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CodeSync</title>
<style>
:root{--bg:#14111f;--panel:#1c1830;--line:#2e2750;--fg:#e9e4f5;--mute:#8f86ad;--acc:#b48cff;--ok:#7fe0b0;--bad:#ff8fa3;
--mono:ui-monospace,"Cascadia Code",Consolas,Menlo,monospace}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
h1{font-size:17px;margin:0 auto 0 0;font-weight:650;letter-spacing:.2px}
.pill{font-size:13px;color:var(--mute)}
.pill b{color:var(--fg);font-weight:600}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--bad);margin-right:6px}
.on .dot{background:var(--ok)}
button{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--panel);color:var(--fg);padding:6px 14px;border-radius:6px;cursor:pointer}
button:hover{border-color:var(--acc)}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
button.run{background:var(--acc);color:#1a1030;border-color:var(--acc);font-weight:650}
button:disabled{opacity:.5;cursor:wait}
main{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr}
@media(max-width:800px){main{grid-template-columns:1fr;grid-template-rows:1fr 1fr}}
section{min-height:0;display:flex;flex-direction:column}
section+section{border-left:1px solid var(--line)}
@media(max-width:800px){section+section{border-left:0;border-top:1px solid var(--line)}}
.label{padding:6px 16px;font-size:13px;color:var(--mute);border-bottom:1px solid var(--line)}
.label.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:4px 16px}
.label.row button{padding:3px 10px;font-size:13px;flex:none}
.tabs{display:flex;border-bottom:1px solid var(--line);overflow-x:auto;flex:none}
.tab{border:0;border-bottom:2px solid transparent;border-radius:0;background:none;color:var(--mute);padding:8px 14px;white-space:nowrap}
.tab:hover{color:var(--fg)}
.tab[aria-selected=true]{color:var(--fg);border-bottom-color:var(--acc)}
textarea,pre{flex:1;margin:0;padding:14px 16px;border:0;resize:none;background:transparent;color:var(--fg);font:14px/1.6 var(--mono);tab-size:2;white-space:pre;overflow:auto}
textarea{caret-color:var(--acc)}
pre{white-space:pre-wrap;background:var(--panel)}
#preview{flex:1;min-height:0;width:100%;border:0;background:#fff}
#console{flex:none;height:96px;padding:8px 12px;font-size:12px;line-height:1.4;border-top:1px solid var(--line)}
#outWeb.full{position:fixed;inset:0;z-index:30;background:var(--bg);padding-top:env(safe-area-inset-top,0px)}
.wrap{position:relative;flex:1;min-height:0;display:flex}
textarea{padding:22px 16px 14px}
#cur{position:absolute;inset:0;overflow:hidden;pointer-events:none}
#mir{position:absolute;left:0;top:0;visibility:hidden;padding:22px 16px 14px;font:14px/1.6 var(--mono);white-space:pre;tab-size:2}
.caret{position:absolute;width:2px;height:22.4px}
.caret i{position:absolute;bottom:100%;left:0;font:600 11px/16px system-ui,sans-serif;padding:0 5px;border-radius:3px 3px 3px 0;white-space:nowrap}
.hide{display:none!important}
#auth{flex:1;display:grid;place-items:center;padding:20px}
#auth form{width:min(340px,100%);display:flex;flex-direction:column;gap:10px}
#auth h2{margin:0 0 4px;font-size:22px}
input{font:inherit;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%}
input[type=color]{padding:2px;height:34px;width:56px}
.err{color:var(--bad);font-size:13px;min-height:18px}
.link{background:none;border:0;color:var(--acc);padding:0;text-align:left}
#me{display:flex;align-items:center;gap:8px}
.sw{width:12px;height:12px;border-radius:50%;display:inline-block;flex:none}
#prof{position:absolute;right:16px;top:52px;z-index:5;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;width:min(280px,calc(100% - 32px));display:flex;flex-direction:column;gap:10px}
#prof label{font-size:13px;color:var(--mute);display:flex;flex-direction:column;gap:4px}
#people{display:flex;gap:10px;flex-wrap:wrap}
</style>
</head>
<body>
<div id="auth" class="hide">
  <form id="af">
    <h2 id="at">Sign in to CodeSync</h2>
    <input id="an" placeholder="Account name" autocomplete="username" maxlength="20" required aria-label="Account name">
    <input id="ap" type="password" placeholder="Password" autocomplete="current-password" required aria-label="Password">
    <input id="ai" placeholder="Invite code (if you were given one)" class="hide" aria-label="Invite code">
    <div class="err" id="ae" role="alert"></div>
    <button class="run" id="ab">Sign in</button>
    <button type="button" class="link" id="as">New here? Create an account</button>
  </form>
</div>
<header id="top" class="hide">
  <h1>CodeSync</h1>
  <span class="pill"><span class="dot"></span><span id="st">connecting</span></span>
  <span class="pill">Round trip <b id="rtt">–</b></span>
  <span id="people" class="pill"></span>
  <button id="copy">Copy room link</button>
  <button id="me" aria-haspopup="true"><span class="sw" id="msw"></span><span id="mn"></span></button>
  <button id="run" class="run" disabled>Run</button>
</header>
<div id="prof" class="hide">
  <label>Name shown on your cursor<input id="pn" maxlength="20"></label>
  <label>Cursor color<input id="pc" type="color"></label>
  <div class="err" id="pe" role="alert"></div>
  <button id="ps" class="run">Save</button>
  <button id="lo" class="link">Sign out</button>
</div>
<main id="app" class="hide">
  <section>
    <div class="tabs" id="tabs" role="tablist" aria-label="Files"></div>
    <div class="wrap">
      <textarea id="ed" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="Code editor" readonly></textarea>
      <div id="cur"></div><div id="mir"></div>
    </div>
  </section>
  <section id="outWeb">
    <div class="label row"><span>Preview: Run puts HTML + CSS + JavaScript together and runs it</span><button id="fs">Fullscreen</button></div>
    <iframe id="preview" title="Preview" sandbox="allow-scripts"></iframe>
    <pre id="console" aria-label="Console">Press Run to start your project.</pre>
  </section>
</main>
<script>
const $ = q => document.querySelector(q);
const ed = $('#ed'), runBtn = $('#run');
const room = location.hash.slice(1) || Math.random().toString(36).slice(2, 7);
location.hash = room;
const api = async (path, body) => {
  const r = await fetch(path, { method: body === undefined ? 'GET' : 'POST', headers: { 'Content-Type': 'application/json' }, body: body === undefined ? undefined : JSON.stringify(body) });
  return { ok: r.ok, data: await r.json().catch(() => ({})) };
};
const ink = hex => (parseInt(hex.slice(1, 3), 16) * 299 + parseInt(hex.slice(3, 5), 16) * 587 + parseInt(hex.slice(5, 7), 16) * 114) / 1000 > 140 ? '#14111f' : '#fff';

// ---- the three files in every room ----
const TABS = [
  { k: 'html', label: 'HTML', file: 'index.html' },
  { k: 'css', label: 'CSS', file: 'style.css' },
  { k: 'js', label: 'JavaScript', file: 'script.js' },
];
const langLabel = k => (TABS.find(t => t.k === k) || {}).label || k;

// ---- sign in / sign up ----
let signup = false, me = null;
function authMode(on) {
  signup = on;
  $('#at').textContent = on ? 'Create your account' : 'Sign in to CodeSync';
  $('#ab').textContent = on ? 'Create account' : 'Sign in';
  $('#as').textContent = on ? 'Already have an account? Sign in' : 'New here? Create an account';
  $('#ai').classList.toggle('hide', !on);
  $('#ap').autocomplete = on ? 'new-password' : 'current-password';
  $('#ae').textContent = '';
}
$('#as').onclick = () => authMode(!signup);
$('#af').onsubmit = async e => {
  e.preventDefault();
  const r = await api(signup ? '/api/signup' : '/api/login', { name: $('#an').value, password: $('#ap').value, invite: $('#ai').value });
  if (r.ok) start(r.data); else $('#ae').textContent = r.data.error || 'Something went wrong';
};
function showMe() { $('#mn').textContent = me.name; $('#msw').style.background = me.color; }
function start(u) {
  me = u; showMe();
  $('#auth').classList.add('hide');
  for (const q of ['#top', '#app']) $(q).classList.remove('hide');
  connect();
}
(async () => { const r = await api('/api/me'); if (r.ok) start(r.data); else $('#auth').classList.remove('hide'); })();

// ---- profile ----
$('#me').onclick = () => { $('#pn').value = me.name; $('#pc').value = me.color; $('#pe').textContent = ''; $('#prof').classList.toggle('hide'); };
$('#ps').onclick = async () => {
  const r = await api('/api/profile', { name: $('#pn').value, color: $('#pc').value });
  if (!r.ok) return $('#pe').textContent = r.data.error || 'Could not save';
  me = r.data; showMe(); $('#prof').classList.add('hide');
  wsSend('{"type":"profile"}');
};
$('#lo').onclick = async () => { await api('/api/logout', {}); location.reload(); };

// ---- operational transform: ops are {t:'i',p,s} or {t:'d',p,n} ----
function xf(a, b, after) {
  if (b.t === 'i') {
    if (a.t === 'i') return [b.p < a.p || (b.p === a.p && after) ? { ...a, p: a.p + b.s.length } : a];
    if (b.p <= a.p) return [{ ...a, p: a.p + b.s.length }];
    if (b.p < a.p + a.n) { const k = b.p - a.p; return [{ t: 'd', p: a.p, n: k }, { t: 'd', p: a.p + b.s.length, n: a.n - k }]; }
    return [a];
  }
  if (a.t === 'i') return [b.p + b.n <= a.p ? { ...a, p: a.p - b.n } : b.p < a.p ? { ...a, p: b.p } : a];
  const ov = Math.max(0, Math.min(a.p + a.n, b.p + b.n) - Math.max(a.p, b.p)), n = a.n - ov;
  return n ? [{ t: 'd', p: b.p < a.p ? a.p - Math.min(b.n, a.p - b.p) : a.p, n }] : [];
}
function xfLists(A, B, after) {
  if (!A.length || !B.length) return [A, B];
  if (A.length === 1 && B.length === 1) return [xf(A[0], B[0], after), xf(B[0], A[0], !after)];
  if (A.length > 1) {
    const [a1, B1] = xfLists([A[0]], B, after), [a2, B2] = xfLists(A.slice(1), B1, after);
    return [a1.concat(a2), B2];
  }
  const [A1, b1] = xfLists(A, [B[0]], after), [A2, b2] = xfLists(A1, B.slice(1), after);
  return [A2, b1.concat(b2)];
}
const apply = (s, o) => o.t === 'i' ? s.slice(0, o.p) + o.s + s.slice(o.p) : s.slice(0, o.p) + s.slice(o.p + o.n);
const moveCursor = (x, o) => o.t === 'i' ? (o.p <= x ? x + o.s.length : x) : (x >= o.p + o.n ? x - o.n : Math.min(x, o.p));

// ---- state: one independent synced document per tab ----
let ws, id = '', ready = false, active = 'html';
const files = {};
for (const t of TABS) files[t.k] = { doc: '', v: 0, outstanding: [], buffer: [], sel: [0, 0], scroll: [0, 0] };
let peers = {}, cursors = {};   // cursors[id] = { lang, s, e }

const wsSend = o => { if (ws && ws.readyState === 1) ws.send(typeof o === 'string' ? o : JSON.stringify(o)); };
function shiftCursors(lang, o) { for (const c of Object.values(cursors)) if (c.lang === lang) { c.s = moveCursor(c.s, o); c.e = moveCursor(c.e, o); } }
const sendCursor = () => { if (ready) wsSend({ type: 'cur', lang: active, s: ed.selectionStart, e: ed.selectionEnd }); };

const PAIR = { '(': ')', '{': '}', '[': ']', '"': '"' };
const AUTO_CLOSERS = new Set([')', '}', ']']);
ed.addEventListener('input', () => {
  const lang = active, F = files[lang], doc = F.doc;
  const n0 = ed.value, m = Math.min(doc.length, n0.length);
  let i = 0; while (i < m && doc[i] === n0[i]) i++;
  let e = 0; while (e < m - i && doc[doc.length - 1 - e] === n0[n0.length - 1 - e]) e++;
  const del = doc.length - i - e;
  const ins0 = n0.slice(i, n0.length - e);

  // Auto-pairing / skip-over, reacting to the character that actually landed
  // rather than to the key press: phone keyboards don't reliably report
  // which key was pressed, but the resulting text change is always accurate.
  let n = n0, ins = ins0;
  if (del === 0 && ins0.length === 1 && ed.selectionStart === i + 1) {
    const ch = ins0;
    if (ch === '"' && doc[i] === '"') { n = doc; ins = ''; ed.value = n; ed.setSelectionRange(i + 1, i + 1); }
    else if (AUTO_CLOSERS.has(ch) && doc[i] === ch) { n = doc; ins = ''; ed.value = n; ed.setSelectionRange(i + 1, i + 1); }
    else if (PAIR[ch]) {
      n = n0.slice(0, i + 1) + PAIR[ch] + n0.slice(i + 1);
      ins = ch + PAIR[ch];
      ed.value = n; ed.setSelectionRange(i + 1, i + 1);
    }
  }

  const ops = [];
  if (del) ops.push({ t: 'd', p: i, n: del });
  if (ins) ops.push({ t: 'i', p: i, s: ins });
  ops.forEach(o => shiftCursors(lang, o));
  F.buffer.push(...ops);
  F.doc = n;
  flush(lang);
  sendCursor();
  redraw();
});
function flush(lang) {
  const F = files[lang];
  if (ready && !F.outstanding.length && F.buffer.length) { F.outstanding = F.buffer; F.buffer = []; sendOps(lang); }
}
const sendOps = lang => wsSend({ type: 'op', lang, base: files[lang].v, ops: files[lang].outstanding });

function remote(lang, m) {
  const F = files[lang];
  F.v = m.v;
  const [o2, r1] = xfLists(F.outstanding, m.ops, true); F.outstanding = o2;
  const [b2, r2] = xfLists(F.buffer, r1, true); F.buffer = b2;
  const here = lang === active;
  let s = here ? ed.selectionStart : F.sel[0], e = here ? ed.selectionEnd : F.sel[1];
  for (const o of r2) { F.doc = apply(F.doc, o); s = moveCursor(s, o); e = moveCursor(e, o); shiftCursors(lang, o); }
  if (here) {
    const top = ed.scrollTop, left = ed.scrollLeft;
    ed.value = F.doc; ed.setSelectionRange(s, e); ed.scrollTop = top; ed.scrollLeft = left;
  } else F.sel = [s, e];
  if (F.outstanding.length) sendOps(lang);
  redraw();
}

// ---- tabs ----
const tabsEl = $('#tabs');
for (const t of TABS) {
  const b = document.createElement('button');
  b.className = 'tab'; b.id = 'tab-' + t.k; b.type = 'button';
  b.setAttribute('role', 'tab'); b.title = t.file; b.textContent = t.label;
  b.onclick = () => switchTo(t.k);
  tabsEl.appendChild(b);
}
function updateTabsUI() {
  for (const t of TABS) $('#tab-' + t.k).setAttribute('aria-selected', String(t.k === active));
  ed.setAttribute('aria-label', langLabel(active) + ' code editor');
}
function switchTo(lang) {
  if (lang === active) return;
  const cur0 = files[active];
  cur0.sel = [ed.selectionStart, ed.selectionEnd]; cur0.scroll = [ed.scrollTop, ed.scrollLeft];
  active = lang;
  const F = files[lang];
  ed.value = F.doc;
  ed.setSelectionRange(Math.min(F.sel[0], F.doc.length), Math.min(F.sel[1], F.doc.length));
  ed.scrollTop = F.scroll[0]; ed.scrollLeft = F.scroll[1];
  updateTabsUI(); sendCursor(); redraw();
}
updateTabsUI();

// ---- other people's cursors (only drawn for the file you're looking at) ----
const cur = $('#cur'), mir = $('#mir');
let dirty = false;
function redraw() { if (!dirty) { dirty = true; requestAnimationFrame(draw); } }
function draw() {
  dirty = false;
  cur.textContent = '';
  const doc = files[active].doc;
  for (const [pid, c] of Object.entries(cursors)) {
    if (c.lang !== active) continue;
    const p = peers[pid]; if (!p) continue;
    mir.textContent = doc.slice(0, Math.min(c.e, doc.length));
    const sp = document.createElement('span'); sp.textContent = '\u200b'; mir.appendChild(sp);
    const el = document.createElement('div'); el.className = 'caret';
    el.style.cssText = `left:${sp.offsetLeft - ed.scrollLeft}px;top:${sp.offsetTop - ed.scrollTop}px;background:${p.color}`;
    const tag = document.createElement('i'); tag.textContent = p.name; tag.style.cssText = `background:${p.color};color:${ink(p.color)}`;
    el.appendChild(tag); cur.appendChild(el);
  }
}
ed.addEventListener('scroll', redraw);
addEventListener('resize', redraw);
document.addEventListener('selectionchange', () => { if (document.activeElement === ed) sendCursor(); });

function setPeers(list) {
  peers = {}; list.forEach(p => peers[p.id] = p);
  for (const k of Object.keys(cursors)) if (!peers[k]) delete cursors[k];
  const box = $('#people'); box.textContent = '';
  list.forEach(p => {
    const t = document.createElement('span'); t.style.cssText = 'display:inline-flex;align-items:center;gap:5px';
    const d = document.createElement('span'); d.className = 'sw'; d.style.background = p.color;
    t.append(d, p.id === id ? p.name + ' (you)' : p.name); box.appendChild(t);
  });
  sendCursor(); redraw();
}

// ---- connection ----
function setState(text, on) { $('#st').textContent = text; $('#top').classList.toggle('on', on); ed.readOnly = !on; runBtn.disabled = !on; }
function connect() {
  ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws?room=' + encodeURIComponent(room));
  ws.onmessage = ev => {
    const m = JSON.parse(ev.data);
    if (m.type === 'id') id = m.id;
    else if (m.type === 'init') {
      const F = files[m.lang]; if (!F) return;
      F.v = m.v; F.doc = m.doc; F.outstanding = []; F.buffer = [];
      if (m.lang === active) ed.value = F.doc;
      ready = true; setState('live', true); redraw();
    } else if (m.type === 'op') {
      const F = files[m.lang]; if (!F) return;
      if (m.id === id) { F.v = m.v; F.outstanding = []; flush(m.lang); sendCursor(); } else remote(m.lang, m);
    } else if (m.type === 'users') setPeers(m.list);
    else if (m.type === 'cur') { cursors[m.id] = { lang: m.lang, s: m.s, e: m.e }; if (m.lang === active) redraw(); }
    else if (m.type === 'pong') $('#rtt').textContent = Math.round(performance.now() - m.t) + ' ms';
    else if (m.type === 'run') runProject(m.by);   // someone else pressed Run: stop and rerun here too
  };
  ws.onclose = async () => {
    ready = false; setState('reconnecting', false);
    const r = await api('/api/me');
    if (!r.ok) return location.reload();
    setTimeout(connect, 1000);
  };
}
setInterval(() => { if (ready) wsSend({ type: 'ping', t: performance.now() }); }, 2000);

// ---- Run: stop everything, put HTML + CSS + JavaScript together, run it ----
// The page runs in a sandboxed frame (no allow-same-origin): it can run
// scripts and report back with postMessage, but it can't see your login or
// anything else on this site.
const preview = $('#preview'), consoleEl = $('#console'), outWeb = $('#outWeb');

// Runs INSIDE the frame (its source is pasted in, so it can't use anything from this page).
function BOOT(jsStart, jsLines) {
  function send(kind, text) { try { parent.postMessage({ __cs: 1, kind: kind, text: text }, '*'); } catch (e) {} }
  function fmt(a) { if (typeof a === 'string') return a; try { var s = JSON.stringify(a); return s === undefined ? String(a) : s; } catch (e) { return String(a); } }
  ['log', 'info', 'warn', 'error'].forEach(function (k) {
    var orig = console[k];
    console[k] = function () { send(k, Array.prototype.map.call(arguments, fmt).join(' ')); try { orig.apply(console, arguments); } catch (e) {} };
  });
  window.alert = function (msg) { send('log', '[alert] ' + msg); };
  function where(line) {
    if (!line) return '';
    if (line >= jsStart && line < jsStart + jsLines) return ' (JavaScript line ' + (line - jsStart + 1) + ')';
    return ' (HTML line ' + line + ')';
  }
  window.addEventListener('error', function (e) { send('error', e.message + where(e.lineno)); });
  window.addEventListener('unhandledrejection', function (e) { send('error', 'Unhandled promise rejection: ' + ((e.reason && e.reason.message) || e.reason)); });
}

let runCount = 0;
function buildPreview(html, css, js) {
  const safeJs = js.replace(/<\/script/gi, '<\\/script');
  const styleTag = '<style>\n' + css.replace(/<\/style/gi, '<\\/style') + '\n</style>';
  const jsLines = js.split('\n').length;
  const bodyEnd = html.search(/<\/body\s*>/i);
  const before = bodyEnd >= 0 ? html.slice(0, bodyEnd) : html;
  const after = bodyEnd >= 0 ? html.slice(bodyEnd) : '';
  const bootSrc = BOOT.toString();
  const nl = s => (s.match(/\n/g) || []).length;
  // Everything added ahead of the JavaScript pushes it down; count that so
  // errors can be reported against the line numbers in the JavaScript tab.
  const jsStart = nl(before) + nl(bootSrc) + nl(styleTag) + 2;
  const boot = '<script>(' + bootSrc + ')(' + jsStart + ',' + jsLines + ');<\/script>';
  // The helper goes right after <head> (so the doctype stays first); the CSS
  // goes just before </head> so it wins over earlier styles.
  const hit = before.match(/<head(\s[^>]*)?>/i) || before.match(/<html(\s[^>]*)?>/i) || before.match(/<!doctype[^>]*>/i);
  const at = hit ? hit.index + hit[0].length : 0;
  const headEnd = before.search(/<\/head\s*>/i);
  const pre = headEnd >= at
    ? before.slice(0, at) + boot + before.slice(at, headEnd) + styleTag + before.slice(headEnd)
    : before.slice(0, at) + boot + styleTag + before.slice(at);
  return pre + '<script>\n' + safeJs + '\n<\/script>\n' + after + '\n<' + '!-- run ' + (++runCount) + ' -->';
}
function logLine(kind, text) {
  const line = document.createElement('div');
  line.textContent = text;
  if (kind === 'error') line.style.color = 'var(--bad)';
  else if (kind === 'warn') line.style.color = '#ffb454';
  else if (kind === 'info') line.style.color = 'var(--mute)';
  consoleEl.appendChild(line);
  while (consoleEl.childNodes.length > 200) consoleEl.removeChild(consoleEl.firstChild);
  consoleEl.scrollTop = consoleEl.scrollHeight;
}
addEventListener('message', ev => {
  if (ev.source !== preview.contentWindow) return;
  const d = ev.data;
  if (d && d.__cs === 1) logLine(d.kind, String(d.text));
});
function runProject(by) {
  consoleEl.textContent = '';
  if (by) logLine('info', '▶ ' + by + ' ran the project');
  preview.srcdoc = buildPreview(files.html.doc, files.css.doc, files.js.doc);   // replacing the page stops whatever was running
  if (!by) preview.focus();
}
function exitFull() { outWeb.classList.remove('full'); $('#fs').textContent = 'Fullscreen'; }
$('#fs').onclick = () => { const on = outWeb.classList.toggle('full'); $('#fs').textContent = on ? 'Exit fullscreen' : 'Fullscreen'; };

// ---- controls ----
runBtn.onclick = () => { runProject(null); wsSend({ type: 'run' }); };   // run here now, and tell everyone else to rerun
$('#copy').onclick = async () => { try { await navigator.clipboard.writeText(location.href); $('#copy').textContent = 'Copied'; setTimeout(() => $('#copy').textContent = 'Copy room link', 1500); } catch {} };
const OPEN = { '(': ')', '{': '}', '[': ']' };
const CLOSERS = new Set([')', '}', ']']);
ed.addEventListener('keydown', e => {
  if (e.key === 'Tab') { e.preventDefault(); document.execCommand('insertText', false, '  '); return; }
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); runBtn.click(); return; }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const doc = files[active].doc;
  const s = ed.selectionStart, eIdx = ed.selectionEnd;
  if (s !== eIdx) return;   // leave an active selection alone
  if (e.key === '"') {
    e.preventDefault();
    if (doc[s] === '"') ed.setSelectionRange(s + 1, s + 1);          // skip over an existing closing quote
    else { document.execCommand('insertText', false, '""'); ed.setSelectionRange(s + 1, s + 1); }
    sendCursor();
  } else if (OPEN[e.key]) {
    e.preventDefault();
    document.execCommand('insertText', false, e.key + OPEN[e.key]);
    ed.setSelectionRange(s + 1, s + 1);
    sendCursor();
  } else if (CLOSERS.has(e.key) && doc[s] === e.key) {
    e.preventDefault();
    ed.setSelectionRange(s + 1, s + 1);                               // skip over an existing closing bracket
    sendCursor();
  }
});
</script>
