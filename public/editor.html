<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CodeSync Live</title>
<style>
  :root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
  html,body{height:100%;margin:0;}
  body{background:#1e1e2e;color:#e4e4ef;font-family:-apple-system,system-ui,sans-serif;display:flex;flex-direction:column;height:100%;overflow:hidden;}
  header{padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top,0px));border-bottom:1px solid #38384f;display:flex;justify-content:space-between;align-items:center;flex-shrink:0;}
  header h1{font-size:14px;margin:0;}
  #status{font-size:12px;color:#9797ac;}
  #shareBar{display:flex;gap:8px;align-items:center;padding:8px 14px;border-bottom:1px solid #38384f;font-size:12px;flex-shrink:0;}
  #shareBar button{background:#262637;color:#e4e4ef;border:1px solid #38384f;border-radius:8px;padding:5px 10px;font-size:12px;}
  #peers{display:flex;gap:6px;padding:8px 14px;overflow-x:auto;flex-shrink:0;border-bottom:1px solid #38384f;}
  .peer-chip{font-size:12px;padding:3px 9px;border-radius:12px;white-space:nowrap;background:#262637;border:1px solid #38384f;}
  main{flex:1;min-height:0;}
  #editor{width:100%;height:100%;box-sizing:border-box;resize:none;border:none;background:#262637;color:#e4e4ef;font-family:'SFMono-Regular',Menlo,Consolas,monospace;font-size:14px;line-height:1.5;padding:12px;outline:none;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));}
</style>
</head>
<body>
<header><h1>&#128187; CodeSync Live</h1><span id="status">connecting…</span></header>
<div id="shareBar"><button id="copyBtn">Copy link to invite friends</button><button id="logoutBtn">Log out</button></div>
<div id="peers"></div>
<main><textarea id="editor" spellcheck="false" placeholder="Loading shared code…"></textarea></main>
<script>
(async function () {
  const statusEl = document.getElementById('status');
  const peersEl = document.getElementById('peers');
  const editor = document.getElementById('editor');
  const roomId = location.pathname.split('/').filter(Boolean)[1] || 'lobby';

  const meRes = await fetch('/api/me');
  if (!meRes.ok) {
    location.href = '/login.html?next=' + encodeURIComponent(location.pathname);
    return;
  }
  const me = await meRes.json();
  let selfId = null;

  document.getElementById('copyBtn').addEventListener('click', () => {
    navigator.clipboard.writeText(location.href).then(() => {
      const btn = document.getElementById('copyBtn');
      btn.textContent = 'Copied!';
      setTimeout(() => { btn.textContent = 'Copy link to invite friends'; }, 1500);
    });
  });
  document.getElementById('logoutBtn').addEventListener('click', async () => {
    await fetch('/api/logout', { method: 'POST' });
    location.href = '/login.html';
  });

  const wsProto = location.protocol === 'https:' ? 'wss://' : 'ws://';
  const ws = new WebSocket(wsProto + location.host + '/ws?room=' + encodeURIComponent(roomId) + '&name=' + encodeURIComponent(me.username));

  let applyingRemote = false;
  function setEditorText(text) {
    if (text === editor.value) return;
    applyingRemote = true;
    const pos = editor.selectionStart;
    editor.value = text;
    try { editor.selectionStart = editor.selectionEnd = Math.min(pos, text.length); } catch (e) {}
    applyingRemote = false;
  }

  ws.addEventListener('open', () => { statusEl.textContent = 'connected'; });
  ws.addEventListener('close', () => { statusEl.textContent = 'disconnected — reload to reconnect'; });
  ws.addEventListener('error', () => { statusEl.textContent = 'connection error'; });

  ws.addEventListener('message', (event) => {
    const msg = JSON.parse(event.data);
    if (msg.type === 'init') {
      selfId = msg.selfId;
      setEditorText(msg.text || '');
    } else if (msg.type === 'edit') {
      setEditorText(msg.text);
    } else if (msg.type === 'peers') {
      renderPeers(msg.users);
    }
  });

  let emitTimer = null;
  editor.addEventListener('input', () => {
    if (applyingRemote) return;
    clearTimeout(emitTimer);
    emitTimer = setTimeout(() => {
      if (ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: 'edit', text: editor.value }));
    }, 120);
    sendCursor();
  });

  function currentLine() { return editor.value.slice(0, editor.selectionStart).split('\n').length; }
  function sendCursor() {
    if (ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: 'cursor', line: currentLine() }));
  }
  editor.addEventListener('click', sendCursor);
  editor.addEventListener('keyup', sendCursor);

  function renderPeers(users) {
    peersEl.innerHTML = '';
    users.forEach(u => {
      const chip = document.createElement('span');
      chip.className = 'peer-chip';
      chip.style.borderColor = u.color;
      const b = document.createElement('b');
      b.style.color = u.color;
      b.textContent = u.name + (u.id === selfId ? ' (you)' : '');
      chip.appendChild(b);
      chip.appendChild(document.createTextNode(' — line ' + u.line));
      peersEl.appendChild(chip);
    });
  }
})();
</script>
</body>
</html>
